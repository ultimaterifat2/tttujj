# wevlo-build v1 — generated by Wevlo. Safe to delete.
name: Wevlo Build
on:
  workflow_dispatch:
    inputs:
      format:
        description: apk, aab or both
        required: true
        default: both
      build_type:
        description: release or debug
        required: true
        default: release
      module:
        description: Gradle app module
        required: true
        default: app
      dir:
        description: Project folder (empty = repository root)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.dir || '.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        env:
          FORMAT: ${{ inputs.format }}
          BUILD_TYPE: ${{ inputs.build_type }}
          MODULE: ${{ inputs.module }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; G=./gradlew; else G=gradle; fi
          CAP="$(echo "${BUILD_TYPE:0:1}" | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"
          case "$FORMAT" in
            apk) T=":$MODULE:assemble$CAP" ;;
            aab) T=":$MODULE:bundle$CAP" ;;
            *) T=":$MODULE:assemble$CAP :$MODULE:bundle$CAP" ;;
          esac
          $G --no-daemon $T
      - name: Collect outputs
        env:
          FORMAT: ${{ inputs.format }}
          MODULE: ${{ inputs.module }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_wevlo_out"
          if [ "$FORMAT" != aab ]; then cp "$(find "$MODULE/build/outputs/apk" -name '*.apk' | head -n1)" "$GITHUB_WORKSPACE/_wevlo_out/app.apk"; fi
          if [ "$FORMAT" != apk ]; then cp "$(find "$MODULE/build/outputs/bundle" -name '*.aab' | head -n1)" "$GITHUB_WORKSPACE/_wevlo_out/app.aab"; fi
      - name: Sign with your keystore (release builds)
        if: ${{ inputs.build_type == 'release' }}
        run: |
          P=wevlo-signing/keystore.properties
          if [ ! -f "$P" ]; then echo "No $P found - keeping the build as Gradle produced it."; exit 0; fi
          prop() { grep -E "^$1=" "$P" | head -n1 | cut -d= -f2- | tr -d '\r'; }
          KS="wevlo-signing/$(basename "$(prop storeFile)")"
          ALIAS="$(prop keyAlias)"
          export WV_STORE_PASS="$(prop storePassword)"
          export WV_KEY_PASS="$(prop keyPassword)"
          [ -n "$WV_KEY_PASS" ] || export WV_KEY_PASS="$WV_STORE_PASS"
          if [ ! -f "$KS" ]; then echo "Keystore file $KS was not found."; exit 1; fi
          OUT="$GITHUB_WORKSPACE/_wevlo_out"
          if [ -f "$OUT/app.apk" ]; then
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:WV_STORE_PASS --key-pass env:WV_KEY_PASS --out "$OUT/signed.apk" "$OUT/app.apk"
            mv "$OUT/signed.apk" "$OUT/app.apk"
            "$BT/apksigner" verify "$OUT/app.apk"
          fi
          if [ -f "$OUT/app.aab" ]; then
            jarsigner -keystore "$KS" -storepass:env WV_STORE_PASS -keypass:env WV_KEY_PASS -sigalg SHA256withRSA -digestalg SHA-256 "$OUT/app.aab" "$ALIAS"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.format != 'aab' }}
        with:
          name: wevlo-apk
          path: ${{ github.workspace }}/_wevlo_out/app.apk
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.format != 'apk' }}
        with:
          name: wevlo-aab
          path: ${{ github.workspace }}/_wevlo_out/app.aab
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
